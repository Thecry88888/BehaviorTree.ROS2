# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  execution_duration_monitoring: false # 關閉執行時間監控
  allowed_execution_duration_scaling: 10.0 # 允許比理論時間慢x倍
  allowed_goal_duration_margin: 0.5 # 額外寬限 0.5 秒

moveit_simple_controller_manager:
  controller_names:
    - lrmate_200id_controller

  lrmate_200id_controller:
    type: FollowJointTrajectory
    interpolate: false
    action_ns: follow_joint_trajectory
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    goal_tolerance: 0.01